name: Bug report
description: Report a reproducible JSON Quality defect.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Use [private vulnerability reporting](https://github.com/Hadden-Industries/json-quality/security/advisories/new) for security issues.
        Do not include credentials, private JSON or personal information here.
  - type: input
    id: version
    attributes:
      label: Package version or source commit
      description: Give the installed version number or full commit ID.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, architecture and Node/npm versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal input, configuration and command
      description: Provide non-sensitive JSON and exact commands, including relevant discovery or native-provider details.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
      description: |-
        Identify the command and include the exit code and final event or summary.
        For CI, link the run and attempt. Give the native companion and effective capacity and runtime settings. Keep diagnostics in the original job logs.
    validations:
      required: true
