name: Feature proposal
description: Explain a JSON Quality use case and its constraints.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
      description: Describe what you are trying to do, where the current behavior falls short, and a small non-sensitive example.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
      description: Describe the behavior you want, alternatives you have considered, and any effects on compatibility, JSON preservation or performance.
    validations:
      required: true
