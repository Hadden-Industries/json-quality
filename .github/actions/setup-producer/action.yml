name: Set up the reference producer
description: Select policy-owned Node and npm, then install the frozen producer graph
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        package-manager-cache: false
    - name: Select the policy-owned producer npm
      shell: bash
      run: npm install --global "npm@$(node -p 'JSON.parse(require("fs").readFileSync("assets/node-support.json")).producerNpm.version')" --ignore-scripts --no-audit --no-fund
    - name: Install frozen producer dependencies
      shell: bash
      run: npm ci --ignore-scripts --no-audit --no-fund
