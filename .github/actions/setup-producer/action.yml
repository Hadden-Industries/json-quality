name: Set up the reference producer
description: Select policy-owned Node and npm, then install the frozen producer graph
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        package-manager-cache: false
    - name: Select the policy-owned producer npm
      shell: bash
      run: |
        npm_root="$(npm root --global)"
        JSON_QUALITY_PRODUCER_NPM="$npm_root/npm/bin/npm-cli.js" node scripts/qualification-process.js producer-npm
    - name: Install frozen producer dependencies
      shell: bash
      run: npm run ci:install
    - name: Install the pinned Markdown development toolchain
      shell: bash
      run: npm run install:markdown
