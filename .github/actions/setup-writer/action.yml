name: Set up the narrow release writer
description: Select pinned runtime and npm tools without installing project dependencies
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: .python-version
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        package-manager-cache: false
    - name: Select the policy-owned producer npm
      shell: bash
      run: |
        npm exec --global --call 'node scripts/qualification-process.js producer-npm'
        npm_prefix="$(npm prefix --global)"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          echo "$npm_prefix" >> "$GITHUB_PATH"
        else
          echo "$npm_prefix/bin" >> "$GITHUB_PATH"
        fi
    - name: Retain the selected native executables
      shell: bash
      run: npm exec --global --call 'node scripts/ci-producer-toolchain.js'
