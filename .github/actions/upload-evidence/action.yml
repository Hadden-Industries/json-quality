name: Upload admitted evidence
description: Bounded SDK transport and reconciliation of a named-consumer bundle
inputs:
  name:
    required: true
    description: Stable original-attempt artifact name
  path:
    required: true
    description: Explicit owned directory of admitted product/evidence bytes
  retention-days:
    required: true
    description: Consumer-specific retention
outputs:
  artifact-id:
    value: ${{ steps.upload.outputs.artifact-id }}
    description: Immutable admitted artifact ID
runs:
  using: composite
  steps:
    - id: upload
      shell: bash
      timeout-minutes: 5
      env:
        EVIDENCE_ROOT: ${{ inputs.path }}
        EVIDENCE_NAME: ${{ inputs.name }}
        EVIDENCE_RETENTION: ${{ inputs.retention-days }}
      run: node scripts/upload-evidence.js bundle "$EVIDENCE_ROOT" "$EVIDENCE_RETENTION" "$EVIDENCE_NAME"
