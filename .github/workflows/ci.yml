name: JSON quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  producer:
    name: Reference producer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.policy.outputs.matrix }}
      consumer-npm: ${{ steps.policy.outputs.consumer-npm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Select the policy-owned producer npm
        shell: bash
        run: npm install --global "npm@$(node -p 'JSON.parse(require("fs").readFileSync("assets/node-support.json")).producerNpm.version')" --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: policy
        name: Freeze minimum, current and reference lanes
        run: npm exec -- node scripts/ci-node-policy.js
      - name: Qualify the complete reference producer
        run: npm run check:full
      - name: Retain one immutable archive for every consumer lane
        run: npm exec -- node scripts/pack.js "${{ runner.temp }}/json-quality-archive"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualified-producer
          path: ${{ runner.temp }}/json-quality-archive/
          if-no-files-found: error

  qualification:
    name: Qualify ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: producer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.producer.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Provision producer dependencies and the native consumer npm
        shell: bash
        env:
          CONSUMER_NPM: ${{ needs.producer.outputs.consumer-npm }}
        run: |
          npm install --global "npm@$(node -p 'JSON.parse(require("fs").readFileSync("assets/node-support.json")).producerNpm.version')" --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix "${{ runner.temp }}/consumer-npm" "npm@$CONSUMER_NPM" --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qualified-producer
          path: ${{ runner.temp }}/json-quality-archive/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Execute source behavior and the transported consumer on the selected runtime
        env:
          JSON_QUALITY_EXPECTED_NODE: ${{ matrix.node }}
          JSON_QUALITY_CONSUMER_NPM: ${{ runner.temp }}/consumer-npm/node_modules/npm/bin/npm-cli.js
          JSON_QUALITY_ARCHIVE_DIRECTORY: ${{ runner.temp }}/json-quality-archive
          JSON_QUALITY_REPORT: ${{ runner.temp }}/consumer-result.json
        run: node scripts/qualify-runtime.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consumer-${{ matrix.os }}-${{ matrix.node }}
          path: ${{ runner.temp }}/consumer-result.json
          if-no-files-found: error

  complete:
    name: Complete runtime qualification
    if: always()
    needs: [producer, qualification]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the producer and every frozen matrix lane
        env:
          PRODUCER_RESULT: ${{ needs.producer.result }}
          CONSUMER_RESULT: ${{ needs.qualification.result }}
        run: |
          test "$PRODUCER_RESULT" = success
          test "$CONSUMER_RESULT" = success
