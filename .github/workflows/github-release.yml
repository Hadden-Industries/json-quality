name: Archive a publicly qualified release
on:
  workflow_dispatch:
    inputs:
      recovery_json:
        description: Optional owner-selected native readback reconciliation of exact original journal bytes
        required: false
        type: string
      previous_run:
        description: previous run
        required: true
        type: string
      previous_attempt:
        description: previous attempt
        required: true
        type: string
      manifest_sha:
        description: manifest sha
        required: true
        type: string
      review_sha:
        description: review sha
        required: true
        type: string
      acceptance_sha:
        description: acceptance sha
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: json-quality-release-mutation
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  RECOVERY_JSON: ${{ inputs.recovery_json }}
  PREVIOUS_RUN: ${{ inputs.previous_run }}
  PREVIOUS_ATTEMPT: ${{ inputs.previous_attempt }}
  MANIFEST_SHA: ${{ inputs.manifest_sha }}
  REVIEW_SHA: ${{ inputs.review_sha }}
  ACCEPTANCE_SHA: ${{ inputs.acceptance_sha }}
jobs:
  admit:
    if: github.repository == 'Hadden-Industries/json-quality' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.admitted.outputs.artifact-id }}
      attest-required: ${{ steps.admission.outputs.attest-required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-producer
      - name: Read complete predecessor and writer history
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:admit -- archive "${{ runner.temp }}/admitted" "${{ runner.temp }}/admission"
      - uses: ./.github/actions/upload-evidence
        timeout-minutes: 5
        id: admitted
        with:
          name: "admitted-archive-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/admitted"
          retention-days: 1
  archive:
    needs: admit
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: github-archival
    permissions:
      contents: write
      actions: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-producer
      - uses: ./.github/actions/download-evidence
        timeout-minutes: 15
        with:
          artifact-id: ${{ needs.admit.outputs.artifact-id }}
          path: ${{ runner.temp }}/admitted/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        if: needs.admit.outputs.attest-required == 'true'
        with:
          subject-path: |
            ${{ runner.temp }}/admitted/*.tgz
            ${{ runner.temp }}/admitted/release-manifest.json
      - name: Apply admitted release effect
        env:
          GH_TOKEN: ${{ github.token }}
          JSON_QUALITY_BUILD_ATTESTATION: ${{ steps.attest.outputs.bundle-path }}
        run: npm run release:effect -- archive "${{ runner.temp }}/admitted" "${{ runner.temp }}/effect-scratch"
      - uses: ./.github/actions/upload-evidence
        timeout-minutes: 5
        if: always()
        with:
          name: "effect-archive-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/admitted"
          retention-days: 90
