name: Main qualification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  host:
    name: Observe ${{ matrix.os }}
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Observe the runner without product tests or dependency installation
        env:
          CI_OS: ${{ matrix.os }}
          HOST_PATH: ${{ runner.temp }}/ci-host-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}.json
        shell: bash
        run: node scripts/ci-host.js "$HOST_PATH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/ci-host-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}.json
          archive: false
          if-no-files-found: error
          retention-days: 1
  observe:
    name: Main / reuse decision
    if: always() && github.event_name == 'push'
    needs: host
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-producer
      - name: Reuse only complete equal-input PR qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-command.js observe
  full:
    name: Explicit FULL
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
      security-events: write
