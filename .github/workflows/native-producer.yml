name: Native producer

on:
  workflow_call:
    inputs:
      run_checks:
        type: boolean
        default: true
      verification_profile:
        description: Closed profile full or cli-community; build-only requires full
        type: string
        default: full

permissions:
  contents: read

jobs:
  component:
    name: Native / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: win32-x64
          - os: ubuntu-24.04
            platform: linux-x64
    defaults:
      run:
        shell: bash
    steps:
      - name: Admit the exact producer source and closed verification mode
        env:
          PRODUCER_REPOSITORY: ${{ job.workflow_repository }}
          PRODUCER_SHA: ${{ job.workflow_sha }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_SHA: ${{ github.sha }}
          RUN_CHECKS: ${{ inputs.run_checks }}
          VERIFICATION_PROFILE: ${{ inputs.verification_profile }}
        run: |
          [[ "$PRODUCER_REPOSITORY" == "Hadden-Industries/json-quality" && "$CALLER_REPOSITORY" == "$PRODUCER_REPOSITORY" ]]
          [[ "$PRODUCER_SHA" =~ ^[a-f0-9]{40}$ && "$CALLER_SHA" == "$PRODUCER_SHA" ]]
          case "$VERIFICATION_PROFILE" in full|cli-community|resource-controls) ;; *) echo 'Unknown verification profile' >&2; exit 2;; esac
          [[ "$RUN_CHECKS" == "true" || "$RUN_CHECKS" == "false" ]]
          [[ "$RUN_CHECKS" == "true" || "$VERIFICATION_PROFILE" == "full" ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Verify the checked-out producer before running local actions
        env:
          PRODUCER_SHA: ${{ job.workflow_sha }}
        run: node --input-type=module -e 'import assert from "node:assert/strict"; import {execFileSync} from "node:child_process"; import {readFileSync} from "node:fs"; assert.equal(execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim(),process.env.PRODUCER_SHA); assert.equal(JSON.parse(readFileSync("package.json","utf8")).name,"@hadden-industries/json-quality");'
      - uses: ./.github/actions/setup-producer
      - name: Check candidate version projections before native production
        run: npm run check:version
      - name: Check policy input inventory before native production
        run: npm run check:policy-inputs
      - name: Build the exact native and control sources
        id: build
        run: |
          cmake --version > "$RUNNER_TEMP/native-toolchain.txt"
          python --version >> "$RUNNER_TEMP/native-toolchain.txt"
          mkdir "$RUNNER_TEMP/json-quality-native"
          python native/build.py --workspace "$RUNNER_TEMP/json-quality-native" --jobs 2 > "$RUNNER_TEMP/native-result.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          root = Path(os.environ['RUNNER_TEMP']) / 'json-quality-native'
          result = json.loads((root.parent / 'native-result.json').read_text(encoding='utf-8'))
          artifacts = Path(result['artifacts'])
          assert result['state'] == 'built'
          assert artifacts.name == 'artifacts' and artifacts.parent.parent == root
          assert re.fullmatch(r'producer-[a-f0-9]{32}', artifacts.parent.name)
          assert re.fullmatch(r'[a-f0-9]{64}', result['sourceInputsSha256'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print('artifacts=' + artifacts.as_posix(), file=output)
              print('source-inputs-sha256=' + result['sourceInputsSha256'], file=output)
          PY
      - name: Stage the verified component through its owner
        if: inputs.run_checks
        env:
          NATIVE_ARTIFACTS: ${{ steps.build.outputs.artifacts }}
        run: python native/stage.py --artifacts "$NATIVE_ARTIFACTS" --replace
      - name: Qualify both bindings and public installed resolution
        if: inputs.run_checks && inputs.verification_profile == 'full'
        env:
          JSON_QUALITY_NATIVE_TEST_ARTIFACTS: ${{ steps.build.outputs.artifacts }}
        run: npm run test:native
      - name: Check the bounded CLI community profile
        if: inputs.run_checks && inputs.verification_profile == 'cli-community'
        env:
          JSON_QUALITY_NATIVE_TEST_ARTIFACTS: ${{ steps.build.outputs.artifacts }}
          CLI_COMMUNITY_TEST_NAMES: "^(CLI discovery parses contextual help before operation admission|human messages explain concrete native findings and safe repair choices|quiet and diagnostic filtering cannot suppress findings or operational failures|quiet hides routine success while warning filtering remains presentation only|bounded terminal escaping does not inspect event arguments or source values|scope and result messages keep repository acceptance distinct from selected checks and writes|previews show candidate observations and remaining quality without claiming replacement|format preview preserves source observations and matches a fresh writer's exact candidates|format preview without a selection reports every eligible unchanged candidate|format preview retains complete native refusal for an invalid unselected peer|format preview cannot transform a protected ignored source|format preview rechecks freshness after provisional candidate delivery|format preview rechecks ignore protection after provisional candidate delivery|qualification partial and obsolete environment do not become no-operation help|scoped event admission refuses repository claims, stale versions and incomplete selected work|virtual selection completion requires input closure and cannot claim disk observations|format preview completion requires exact candidate counts or an explicit complete refusal|stdin filename admission preserves raw contracts and refuses contradictory framing before acquisition|CLI mode admission refuses legacy writes and mixed stdin reporting without opening a repository|raw stdin transforms preserve numeric lexemes and keep formatting separate from NFC|stdin transforms refuse malformed values, NFC collisions and expected-byte substitutions without source output|policy-aware stdin checks virtual bytes without reading or rewriting a bad target or peer|stdin output cannot acquire protected producer paths or bypass writer quotas|stdin transform rechecks policy absence before exposing a derived source|raw source filename context keeps terminal scope distinct from repository acceptance|stdin transform cancellation settles native storage before refusing output|broken stdin transform output exits incomplete after genuine native cleanup|selected option admission rejects implicit roots and authority-bearing fields before component acquisition|selected option admission rejects executable data and invalid literal identities|selected native checks pass beside invalid unselected peers without Git or provider execution|selected native checks retain explicit excluded reads and producer ownership|selected native admission rejects duplicate physical aliases and directories before source delivery|selected native terminals retain completed quality refusals and policy freshness|selected native iteration cleanup withholds completion and empties owned temporary storage|selected native cleanup failure withholds the aggregate terminal|selected native checks refuse linked obligations before delivering a selected source|selected native checks withhold terminals after selected mutation or newly appearing policy|selected native admission charges the complete selection before source delivery|selected virtual contracts preserve producer protection without invented disk identities|read-only repository checks retain complete scope and cannot select literal subsets|normalization preview binds decoded changes and no-change results to Unicode identity|normalization preview reports complete collision refusal without a write terminal|normalization preview keeps preserved policy and invalid selections as errors|selected formatting retains invalid-peer preflight and changes only selected sources|CLI argument admission and help run before trusted context loading|trusted CLI adapters retain fixed roots and required-output obligations|raw source checks cannot replace a trusted repository adapter's obligations|CLI consumes raw source bytes and delivers correlated complete NDJSON|CLI formats through the installed fixed component with a final write terminal|failed CLI output delivery closes its source session and exits incomplete)$"
        run: >-
          node --test --test-concurrency=1 --test-name-pattern "$CLI_COMMUNITY_TEST_NAMES"
          tests/cli-entry.test.js tests/cli-messages.test.js
          tests/cli-contracts.test.js tests/cli-stdin.test.js tests/selected-check.test.js tests/cli-flexibility.test.js
          tests/native/repository-rewrite.test.mjs tests/native/cli-events.test.mjs
      - name: Identify focused verification limits
        if: inputs.run_checks && inputs.verification_profile == 'cli-community'
        run: echo 'Focused CLI checks only. Full native, sanitizer, installed/package and release qualification remain pending.' >> "$GITHUB_STEP_SUMMARY"
      - name: Check the focused resource controls profile
        if: inputs.run_checks && inputs.verification_profile == 'resource-controls'
        env:
          JSON_QUALITY_NATIVE_TEST_ARTIFACTS: ${{ steps.build.outputs.artifacts }}
          RESOURCE_CONTROL_TEST_NAMES: "^(human path and pointer controls admit finite raised and null scalar-safe displays|real Git diagnostic capture honors caller quotas beyond former 64-byte and 4-KiB clamps|bounded tools retain complete selected diagnostics and admit long finite timeouts|POSIX tool termination grace honors finite raised and null selections after real readiness|Node reply assembly preserves split UTF-8 and refuses malformed continuation frames|native census round-trips extended Unicode paths and metadata through bounded reply fragments|native extended metadata retains finite path and complete output refusal with fresh retry|direct Python metadata reads preserve full fragmented replies and close interrupted pulls|direct Python ordinary reads admit unlimited quotas and depth beyond 4096|native effective resources are projected from the maintained schema|a restrictive native output capacity fails explicitly and permits cleanup|qualification CLI delivers NDJSON for the immutable source scope)$"
        run: >-
          node --test --test-concurrency=1 --test-name-pattern "$RESOURCE_CONTROL_TEST_NAMES"
          tests/remaining-resource-controls.test.js tests/native/resource-metadata.test.mjs
          tests/native/stdio.test.mjs tests/native/resource-policy.test.mjs tests/native/git-qualification.test.mjs
      - name: Identify focused resource verification limits
        if: inputs.run_checks && inputs.verification_profile == 'resource-controls'
        run: echo 'Focused resource, metadata transport and affected regression checks only. Full native, sanitizer and release qualification remain separate.' >> "$GITHUB_STEP_SUMMARY"
      - name: Identify production-only evidence
        if: ${{ !inputs.run_checks }}
        run: echo 'Production only. Native tests, installed qualification, rights acceptance and final review remain pending.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain exact native payload, rights and source identities
        id: payload
        if: success()
        uses: ./.github/actions/upload-evidence
        timeout-minutes: 5
        with:
          name: "native-${{ matrix.platform }}-${{ job.workflow_sha }}-${{ inputs.run_checks && inputs.verification_profile || 'build-only' }}-${{ github.run_attempt }}"
          path: "${{ steps.build.outputs.artifacts }}"
          retention-days: 30
      - name: Record the immutable payload identity and verification scope
        env:
          SOURCE_SHA: ${{ job.workflow_sha }}
          SOURCE_INPUTS_SHA256: ${{ steps.build.outputs.source-inputs-sha256 }}
          PLATFORM: ${{ matrix.platform }}
          VERIFICATION_SCOPE: ${{ inputs.run_checks && inputs.verification_profile || 'build-only' }}
          ARTIFACT_ID: ${{ steps.payload.outputs.artifact-id }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          printf 'Source commit: `%s`\n\nSource-input digest: `%s`\n\nPlatform: `%s`\n\nVerification scope: `%s`\n\nImmutable artifact ID: `%s`\n' "$SOURCE_SHA" "$SOURCE_INPUTS_SHA256" "$PLATFORM" "$VERIFICATION_SCOPE" "$ARTIFACT_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Write producer diagnostics to native job logs
        if: always()
        run: python scripts/log-native-diagnostics.py "$RUNNER_TEMP/json-quality-native"

  sanitizers:
    name: Native / address and undefined behavior sanitizers
    if: inputs.run_checks && inputs.verification_profile == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Admit the exact producer source and full verification mode
        env:
          PRODUCER_REPOSITORY: ${{ job.workflow_repository }}
          PRODUCER_SHA: ${{ job.workflow_sha }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_SHA: ${{ github.sha }}
          RUN_CHECKS: ${{ inputs.run_checks }}
          VERIFICATION_PROFILE: ${{ inputs.verification_profile }}
        run: |
          [[ "$PRODUCER_REPOSITORY" == "Hadden-Industries/json-quality" && "$CALLER_REPOSITORY" == "$PRODUCER_REPOSITORY" ]]
          [[ "$PRODUCER_SHA" =~ ^[a-f0-9]{40}$ && "$CALLER_SHA" == "$PRODUCER_SHA" ]]
          case "$VERIFICATION_PROFILE" in full|cli-community|resource-controls) ;; *) echo 'Unknown verification profile' >&2; exit 2;; esac
          [[ "$RUN_CHECKS" == "true" || "$RUN_CHECKS" == "false" ]]
          [[ "$RUN_CHECKS" == "true" || "$VERIFICATION_PROFILE" == "full" ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Verify the checked-out producer before selecting tools
        env:
          PRODUCER_SHA: ${{ job.workflow_sha }}
        run: node --input-type=module -e 'import assert from "node:assert/strict"; import {execFileSync} from "node:child_process"; import {readFileSync} from "node:fs"; assert.equal(execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim(),process.env.PRODUCER_SHA); assert.equal(JSON.parse(readFileSync("package.json","utf8")).name,"@hadden-industries/json-quality");'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Build a separate instrumented component for verification
        env:
          CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: |
          cmake --version > "$RUNNER_TEMP/native-sanitizer-toolchain.txt"
          python --version >> "$RUNNER_TEMP/native-sanitizer-toolchain.txt"
          mkdir "$RUNNER_TEMP/json-quality-sanitizers"
          python native/build.py --workspace "$RUNNER_TEMP/json-quality-sanitizers" --jobs 2 > "$RUNNER_TEMP/native-sanitizer-result.json"
      - name: Check real spill, references, transport faults and cleanup under instrumentation
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1:log_path=${{ runner.temp }}/native-sanitizer-asan
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          root = Path(os.environ['RUNNER_TEMP'])
          result = json.loads((root / 'native-sanitizer-result.json').read_text(encoding='utf-8'))
          artifacts = Path(result['artifacts'])
          assert result['state'] == 'built' and result['platform'] == 'linux-x64'
          assert artifacts.name == 'artifacts' and artifacts.parent.parent == root / 'json-quality-sanitizers'
          assert re.fullmatch(r'producer-[a-f0-9]{32}', artifacts.parent.name)
          executable = artifacts / 'json-quality-native'
          dynamic = subprocess.run(['readelf', '--dynamic', str(executable)], check=True, capture_output=True, text=True, timeout=10).stdout
          assert 'libasan.so' in dynamic and 'libubsan.so' in dynamic
          (root / 'native-sanitizer-dynamic.txt').write_text(dynamic, encoding='utf-8')
          sys.path.insert(0, str(Path('tests/native').resolve()))
          from stdio_probe import Host
          manifest = json.loads((artifacts / 'component.json').read_text(encoding='utf-8'))
          for _ in range(32):
              Host(executable, root, manifest).close()
          (root / 'native-sanitizer-startup.json').write_text(json.dumps({'launches': 32, 'sourceInputsSha256': manifest['sourceInputsSha256']}), encoding='utf-8')
          with (root / 'native-sanitizer-protocol.json').open('x', encoding='utf-8') as output:
              subprocess.run([sys.executable, 'tests/native/stdio_probe.py', str(executable), str(artifacts / 'component.json'), str(root), str(os.getpid())], check=True, stdout=output, timeout=300)
          PY
      - name: Write sanitizer diagnostics to native job logs
        if: always()
        run: python scripts/log-native-diagnostics.py "$RUNNER_TEMP/json-quality-sanitizers" "$RUNNER_TEMP"
