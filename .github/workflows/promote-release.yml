name: Promote or restore exact availability labels
on:
  workflow_dispatch:
    inputs:
      operation_json:
        description: Exact owner-reviewed family promotion, alignment, restoration or pilot retirement scope and qualification identities
        required: true
        type: string
      operation_sha:
        description: SHA256 of exact availability operation bytes
        required: true
        type: string
      recovery_json:
        description: Optional owner-selected native readback reconciliation of exact original journal bytes
        required: false
        type: string
      previous_run:
        description: previous run
        required: true
        type: string
      previous_attempt:
        description: previous attempt
        required: true
        type: string
      manifest_sha:
        description: manifest sha
        required: true
        type: string
      review_sha:
        description: review sha
        required: true
        type: string
      acceptance_sha:
        description: acceptance sha
        required: false
        type: string
      expected_labels:
        description: expected labels (JSON with explicit prior latest and githubLatest, including null)
        required: false
        type: string
      restore_version:
        description: restore version
        required: false
        type: string
      restoration_sha:
        description: restoration sha
        required: false
        type: string
      restoration_json:
        description: Exact owner-reviewed restoration decision JSON (separately digest-bound)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: json-quality-release-mutation
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  OPERATION_JSON: ${{ inputs.operation_json }}
  OPERATION_SHA: ${{ inputs.operation_sha }}
  RECOVERY_JSON: ${{ inputs.recovery_json }}
  PREVIOUS_RUN: ${{ inputs.previous_run }}
  PREVIOUS_ATTEMPT: ${{ inputs.previous_attempt }}
  MANIFEST_SHA: ${{ inputs.manifest_sha }}
  REVIEW_SHA: ${{ inputs.review_sha }}
  ACCEPTANCE_SHA: ${{ inputs.acceptance_sha }}
  EXPECTED_LABELS: ${{ inputs.expected_labels }}
  RESTORE_VERSION: ${{ inputs.restore_version }}
  RESTORATION_SHA: ${{ inputs.restoration_sha }}
  RESTORATION_JSON: ${{ inputs.restoration_json }}
jobs:
  admit:
    if: github.repository == 'Hadden-Industries/json-quality' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      security-events: read
    outputs:
      artifact-id: ${{ steps.admitted.outputs.artifact-id }}
      artifact-digest: ${{ steps.admitted.outputs.artifact-digest }}
      receipt-sha256: ${{ steps.admission.outputs.receipt-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-producer
      - name: Read complete predecessor and writer history
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run admit:release-evidence -- promote "${{ runner.temp }}/admitted" "${{ runner.temp }}/admission"
      - uses: ./.github/actions/upload-evidence
        timeout-minutes: 5
        id: admitted
        with:
          name: "admitted-promote-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/admitted"
          retention-days: 90
  npm:
    needs: admit
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    environment: npm-promotion
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      ADMISSION_ARTIFACT_ID: ${{ needs.admit.outputs.artifact-id }}
      ADMISSION_ARTIFACT_DIGEST: ${{ needs.admit.outputs.artifact-digest }}
      ADMISSION_RECEIPT_SHA: ${{ needs.admit.outputs.receipt-sha256 }}
    outputs:
      artifact-id: ${{ steps.effect.outputs.artifact-id }}
      availability: ${{ steps.npm.outputs.availability }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-writer
      - uses: ./.github/actions/download-evidence
        timeout-minutes: 15
        with:
          artifact-id: ${{ needs.admit.outputs.artifact-id }}
          path: ${{ runner.temp }}/admitted/
      - name: Apply admitted release effect
        id: npm
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-command.js promote-npm "${{ runner.temp }}/admitted" "${{ runner.temp }}/effect-scratch"
      - uses: ./.github/actions/upload-writer-evidence
        timeout-minutes: 5
        if: always()
        id: effect
        with:
          name: "effect-promote-npm-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/admitted"
          retention-days: 90

  github:
    needs: [admit, npm]
    if: needs.npm.result == 'success' && needs.npm.outputs.availability == 'npm-and-github'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    environment: github-release
    permissions:
      contents: write
      actions: read
    env:
      ADMISSION_ARTIFACT_ID: ${{ needs.admit.outputs.artifact-id }}
      ADMISSION_ARTIFACT_DIGEST: ${{ needs.admit.outputs.artifact-digest }}
      ADMISSION_RECEIPT_SHA: ${{ needs.admit.outputs.receipt-sha256 }}
    outputs:
      artifact-id: ${{ steps.effect.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-writer
      - uses: ./.github/actions/download-evidence
        timeout-minutes: 15
        with:
          artifact-id: ${{ needs.npm.outputs.artifact-id }}
          path: ${{ runner.temp }}/admitted/
      - name: Apply admitted release effect
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_CONTINUATION_ID: ${{ needs.npm.outputs.artifact-id }}
        run: node scripts/release-command.js promote-github "${{ runner.temp }}/admitted" "${{ runner.temp }}/effect-scratch"
      - uses: ./.github/actions/upload-writer-evidence
        timeout-minutes: 5
        if: always()
        id: effect
        with:
          name: "effect-promote-github-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/admitted"
          retention-days: 90

  complete:
    needs: [admit, npm, github]
    if: always() && needs.npm.result == 'success' && (needs.github.result == 'success' || needs.github.result == 'skipped')
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      security-events: read
    env:
      ADMISSION_ARTIFACT_ID: ${{ needs.admit.outputs.artifact-id }}
      ADMISSION_ARTIFACT_DIGEST: ${{ needs.admit.outputs.artifact-digest }}
      ADMISSION_RECEIPT_SHA: ${{ needs.admit.outputs.receipt-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-producer
      - uses: ./.github/actions/download-evidence
        timeout-minutes: 15
        with:
          artifact-id: ${{ needs.github.outputs.artifact-id || needs.npm.outputs.artifact-id }}
          path: ${{ runner.temp }}/admitted/
      - name: Verify every service selected by the owner decision
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_CONTINUATION_ID: ${{ needs.npm.outputs.artifact-id }}
          GITHUB_CONTINUATION_ID: ${{ needs.github.outputs.artifact-id }}
          NPM_RESULT: ${{ needs.npm.result }}
          GITHUB_RESULT: ${{ needs.github.result }}
        run: node scripts/complete-promotion.js "${{ runner.temp }}/admitted" "${{ runner.temp }}/completion-scratch"
      - uses: ./.github/actions/upload-evidence
        timeout-minutes: 5
        if: always()
        with:
          name: "completion-promote-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/admitted"
          retention-days: 90
