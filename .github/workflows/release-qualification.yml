name: Qualify a deliberate release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact owner-selected version already committed on main
        required: true
        type: string
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  resolve:
    if: github.repository == 'Hadden-Industries/json-quality' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-producer
      - id: resolve
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: npm run release:prepare -- resolve
  product:
    needs: resolve
    uses: ./.github/workflows/qualification.yml
    permissions:
      contents: read
      actions: read
    with:
      matrix: ${{ needs.resolve.outputs.matrix }}
      release-mode: true
      version: ${{ inputs.version }}
  codeql:
    needs: resolve
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
  security:
    needs: [product, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-producer
      - uses: ./.github/actions/download-evidence
        with:
          artifact-id: ${{ needs.product.outputs.archive-id }}
          path: ${{ runner.temp }}/frozen
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run check:security -- "${{ runner.temp }}/security"
          npm run release:security -- "${{ runner.temp }}/frozen" "${{ runner.temp }}/security"
      - uses: ./.github/actions/upload-evidence
        if: always()
        with:
          name: "release-security-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/security"
          retention-days: 30
  qualified:
    if: always()
    needs: [resolve, product, codeql, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict"; const needs=JSON.parse(process.env.NEEDS_JSON); assert.deepEqual(Object.keys(needs).sort(),["codeql","product","resolve","security"]); for(const job of Object.values(needs)) assert.equal(job.result,"success");'
          echo 'Nonpublishing qualification completed. Review the manifest digest and complete provider graph before creating the signed tag and staging.' >> "$GITHUB_STEP_SUMMARY"
