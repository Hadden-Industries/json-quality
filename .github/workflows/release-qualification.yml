name: Qualify a deliberate release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact owner-selected version already committed on main
        required: true
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  resolve:
    if: github.repository == 'Hadden-Industries/json-quality' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-producer
      - id: resolve
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: npm run release:prepare -- resolve
  product:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      matrix: ${{ needs.resolve.outputs.matrix }}
      release-mode: true
      version: ${{ inputs.version }}
  security:
    needs: product
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-producer
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qualified-producer-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frozen
          digest-mismatch: error
      - env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:security -- "${{ runner.temp }}/frozen" "${{ runner.temp }}/security"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-security-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security/*.json
          if-no-files-found: error
          retention-days: 90
  qualified:
    if: always()
    needs: [resolve, product, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict"; const needs=JSON.parse(process.env.NEEDS_JSON); assert.deepEqual(Object.keys(needs).sort(),["product","resolve","security"]); for(const job of Object.values(needs)) assert.equal(job.result,"success");'
          echo 'Nonpublishing qualification completed. Review the manifest digest and complete provider graph before creating the signed tag and staging.' >> "$GITHUB_STEP_SUMMARY"
