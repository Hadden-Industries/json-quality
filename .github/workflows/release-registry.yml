name: Qualify the approved public registry version
on:
  workflow_dispatch:
    inputs:
      recovery_json:
        description: Optional owner-selected native readback reconciliation of exact original journal bytes
        required: false
        type: string
      previous_run:
        description: previous run
        required: true
        type: string
      previous_attempt:
        description: previous attempt
        required: true
        type: string
      manifest_sha:
        description: manifest sha
        required: true
        type: string
      review_sha:
        description: review sha
        required: true
        type: string
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
env:
  RECOVERY_JSON: ${{ inputs.recovery_json }}
  PREVIOUS_RUN: ${{ inputs.previous_run }}
  PREVIOUS_ATTEMPT: ${{ inputs.previous_attempt }}
  MANIFEST_SHA: ${{ inputs.manifest_sha }}
  REVIEW_SHA: ${{ inputs.review_sha }}
jobs:
  admit:
    if: github.repository == 'Hadden-Industries/json-quality' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      artifact-id: ${{ steps.admitted.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-producer
      - env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:admit -- registry "${{ runner.temp }}/admitted" "${{ runner.temp }}/admission"
      - id: matrix
        env:
          RELEASE_DIRECTORY: ${{ runner.temp }}/admitted
        run: node --input-type=module -e 'import {readFileSync,appendFileSync} from "node:fs"; import {join} from "node:path"; const m=JSON.parse(readFileSync(join(process.env.RELEASE_DIRECTORY,"release-manifest.json"))); appendFileSync(process.env.GITHUB_OUTPUT,"matrix="+JSON.stringify(m.matrix)+"\n");'
      - uses: ./.github/actions/upload-evidence
        id: admitted
        with:
          name: "admitted-registry-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/admitted"
          retention-days: 1
  registry:
    needs: admit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.admit.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-producer
      - name: Retain publisher verifier and provision supported consumer npm
        run: |
          npm run ci:producer-toolchain
          npm run ci:consumer-npm -- "${{ runner.temp }}/consumer-npm"
      - uses: ./.github/actions/download-evidence
        with:
          artifact-id: ${{ needs.admit.outputs.artifact-id }}
          path: ${{ runner.temp }}/admitted/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Qualify anonymous exact-version recipients with original publisher identity
        env:
          JSON_QUALITY_CONSUMER_NPM: ${{ runner.temp }}/consumer-npm/node_modules/npm/bin/npm-cli.js
          JSON_QUALITY_EXPECTED_NODE: ${{ matrix.node }}
          JSON_QUALITY_VALIDATOR_ROOT: ${{ runner.temp }}/validation-tool
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qualify-registry.js "${{ runner.temp }}/admitted" "${{ runner.temp }}/registry"
      - uses: ./.github/actions/upload-evidence
        if: always()
        with:
          name: "registry-${{ matrix.os }}-${{ matrix.node }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/registry"
          retention-days: 30
  security:
    needs: admit
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-producer
      - uses: ./.github/actions/download-evidence
        with:
          artifact-id: ${{ needs.admit.outputs.artifact-id }}
          path: ${{ runner.temp }}/admitted/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:security -- "${{ runner.temp }}/admitted" "${{ runner.temp }}/security"
      - uses: ./.github/actions/upload-evidence
        if: always()
        with:
          name: "public-security-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/security"
          retention-days: 30
  qualified:
    if: always()
    needs: [admit, registry, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node --input-type=module -e 'import assert from "node:assert/strict"; const needs=JSON.parse(process.env.NEEDS_JSON); assert.deepEqual(Object.keys(needs).sort(),["admit","registry","security"]); for(const job of Object.values(needs)) assert.equal(job.result,"success");'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-producer
      - uses: ./.github/actions/download-evidence
        with:
          artifact-id: ${{ needs.admit.outputs.artifact-id }}
          path: ${{ runner.temp }}/admitted/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:collect -- "${{ runner.temp }}/admitted" "${{ runner.temp }}/collection"
      - uses: ./.github/actions/upload-evidence
        if: always()
        with:
          name: "public-registry-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/admitted"
          retention-days: 90
