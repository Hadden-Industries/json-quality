name: Security
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"
permissions:
  contents: read
jobs:
  codeql:
    name: Scan ${{ matrix.key }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: actions
            language: actions
            os: ubuntu-24.04
            build-mode: none
            category: /language:actions
          - key: javascript-typescript
            language: javascript-typescript
            os: ubuntu-24.04
            build-mode: none
            category: /language:javascript-typescript
          - key: python
            language: python
            os: ubuntu-24.04
            build-mode: none
            category: /language:python
          - key: cpp-linux
            language: c-cpp
            os: ubuntu-24.04
            build-mode: manual
            category: /language:c-cpp/platform:linux
          - key: cpp-windows
            language: c-cpp
            os: windows-2025
            build-mode: manual
            category: /language:c-cpp/platform:windows
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Trace both native bindings and generated inputs through the native owner
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/json-quality-codeql"
          python native/build.py --workspace "$RUNNER_TEMP/json-quality-codeql" --jobs 2
      - name: Write native extraction build diagnostics
        if: always() && matrix.build-mode == 'manual'
        shell: bash
        run: python scripts/log-native-diagnostics.py "$RUNNER_TEMP/json-quality-codeql"
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: ${{ matrix.category }}
