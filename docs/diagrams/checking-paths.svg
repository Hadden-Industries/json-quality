<?xml version="1.0" encoding="UTF-8"?>
<svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 960 720"
            role="img"
            aria-labelledby="checking-paths-title checking-paths-desc"
          >
            <title id="checking-paths-title">
              Two transports, one checking core
            </title>
            <desc id="checking-paths-desc">
              The Node.js CLI, SDK and trusted repository adapters use Node-API.
              Other hosts use the framed standalone executable. Both transports
              reach the same C++20 grammar and Unicode checking core, backed by
              the managed value store. The store starts in memory and can
              transition once to owned disk. Boost, ICU and SQLite are
              implementation details described in the architecture text.
            </desc>
