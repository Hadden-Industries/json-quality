<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A rewrite can stop after some writes | JSON Quality</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #ffffff;
        color: #1d2733;
        font:
          1rem/1.6 system-ui,
          sans-serif;
      }
      main {
        max-width: 960px;
        margin: auto;
        min-width: 0;
      }
      h1 {
        font-size: 1.5rem;
        line-height: 1.3;
      }
      figure {
        margin: 0;
      }
      .diagram-container {
        width: 100%;
        overflow-x: auto;
      }
      svg {
        display: block;
        width: 100%;
        min-width: 960px;
      }
      figcaption {
        margin-top: 16px;
      }
      @media print {
        svg {
          min-width: 0;
        }
        .diagram-container {
          overflow: visible;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>A rewrite can stop after some writes</h1>
      <figure>
        <div
          class="diagram-container"
          role="region"
          aria-label="Scrollable diagram"
          tabindex="0"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 960 800"
            role="img"
            aria-labelledby="guarded-rewrite-title guarded-rewrite-desc"
          >
            <title id="guarded-rewrite-title">
              A rewrite can stop after some writes
            </title>
            <desc id="guarded-rewrite-desc">
              Preflight the whole selection and every candidate before writing.
              A refused preflight changes nothing. For each replacement, stage
              bytes, recheck the preimage, rename and verify. Staging, recheck
              or replacement failure stops the batch and reports confirmed
              writes and any uncertain path. Confirmed writes are not rolled
              back. Replace the policy last.
            </desc>
            <defs>
              <marker
                id="guarded-rewrite-arrow"
                markerWidth="8"
                markerHeight="8"
                refX="7"
                refY="4"
                orient="auto"
              >
                <path d="M 0 0 L 8 4 L 0 8 Z" fill="#465568" />
              </marker>
            </defs>
            <rect width="960" height="800" fill="#ffffff" />
            <text
              x="40"
              y="48"
              text-anchor="start"
              font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
              font-size="30"
              fill="#1d2733"
            >
              <tspan x="40" dy="0">A rewrite can stop after some writes</tspan>
            </text>
            <path
              data-edge="true"
              d="M 288 168 V 208"
              fill="none"
              stroke="#465568"
              stroke-width="2"
              marker-end="url(#guarded-rewrite-arrow)"
            />
            <path
              data-edge="true"
              d="M 288 328 V 376"
              fill="none"
              stroke="#465568"
              stroke-width="2"
              marker-end="url(#guarded-rewrite-arrow)"
            />
            <path
              data-edge="true"
              d="M 448 268 H 664 Q 672 268 672 276 V 376"
              fill="none"
              stroke="#465568"
              stroke-width="2"
              marker-end="url(#guarded-rewrite-arrow)"
            />
            <path
              data-edge="true"
              d="M 288 460 V 500"
              fill="none"
              stroke="#465568"
              stroke-width="2"
              marker-end="url(#guarded-rewrite-arrow)"
            />
            <path
              data-edge="true"
              d="M 288 584 V 624"
              fill="none"
              stroke="#465568"
              stroke-width="2"
              marker-end="url(#guarded-rewrite-arrow)"
            />
            <path
              data-edge="true"
              d="M 448 542 H 512 Q 520 542 520 550 V 658 Q 520 666 528 666 H 544"
              fill="none"
              stroke="#465568"
              stroke-width="2"
              marker-end="url(#guarded-rewrite-arrow)"
            />
            <g data-label="true">
              <rect x="306.0" y="337" width="68" height="30" fill="#ffffff" />
              <text
                x="340"
                y="359"
                text-anchor="middle"
                font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
                font-size="18"
                fill="#465568"
              >
                <tspan x="340" dy="0">PASS</tspan>
              </text>
            </g>
            <g data-label="true">
              <rect x="504.0" y="228" width="104" height="30" fill="#ffffff" />
              <text
                x="556"
                y="250"
                text-anchor="middle"
                font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
                font-size="18"
                fill="#465568"
              >
                <tspan x="556" dy="0">REFUSED</tspan>
              </text>
            </g>
            <g data-label="true">
              <rect x="538.0" y="504" width="92" height="30" fill="#ffffff" />
              <text
                x="584"
                y="526"
                text-anchor="middle"
                font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
                font-size="18"
                fill="#465568"
              >
                <tspan x="584" dy="0">FAILED</tspan>
              </text>
            </g>
            <g data-node="true">
              <rect
                x="128"
                y="96"
                width="320"
                height="72"
                rx="6"
                fill="#ffffff"
                stroke="#465568"
                stroke-width="2"
              />
              <text
                x="288.0"
                y="140.0"
                text-anchor="middle"
                font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
                font-size="24"
                fill="#1d2733"
              >
                <tspan x="288.0" dy="0">Select eligible files</tspan>
              </text>
            </g>
            <g data-node="true">
              <path
                d="M 288.0 208 L 448 268.0 L 288.0 328 L 128 268.0 Z"
                fill="#ffffff"
                stroke="#0755a6"
                stroke-width="3"
              />
              <text
                x="288.0"
                y="261.0"
                text-anchor="middle"
                font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
                font-size="24"
                fill="#1d2733"
              >
                <tspan x="288.0" dy="0">Whole-selection</tspan>
                <tspan x="288.0" dy="30">preflight passes?</tspan>
              </text>
            </g>
            <g data-node="true">
              <rect
                x="128"
                y="376"
                width="320"
                height="84"
                rx="6"
                fill="#ffffff"
                stroke="#465568"
                stroke-width="2"
              />
              <text
                x="288.0"
                y="411.0"
                text-anchor="middle"
                font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
                font-size="24"
                fill="#1d2733"
              >
                <tspan x="288.0" dy="0">Stage one file;</tspan>
                <tspan x="288.0" dy="30">recheck original bytes</tspan>
              </text>
            </g>
            <g data-node="true">
              <rect
                x="544"
                y="376"
                width="320"
                height="84"
                rx="24"
                fill="#ffffff"
                stroke="#465568"
                stroke-width="2"
              />
              <text
                x="704.0"
                y="426.0"
                text-anchor="middle"
                font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
                font-size="24"
                fill="#1d2733"
              >
                <tspan x="704.0" dy="0">Stop before writes</tspan>
              </text>
            </g>
            <g data-node="true">
              <rect
                x="128"
                y="500"
                width="320"
                height="84"
                rx="6"
                fill="#ffffff"
                stroke="#465568"
                stroke-width="2"
              />
              <text
                x="288.0"
                y="535.0"
                text-anchor="middle"
                font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
                font-size="24"
                fill="#1d2733"
              >
                <tspan x="288.0" dy="0">Replace and verify</tspan>
                <tspan x="288.0" dy="30">each selected file</tspan>
              </text>
            </g>
            <g data-node="true">
              <rect
                x="128"
                y="624"
                width="320"
                height="84"
                rx="24"
                fill="#ffffff"
                stroke="#465568"
                stroke-width="2"
              />
              <text
                x="288.0"
                y="674.0"
                text-anchor="middle"
                font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
                font-size="24"
                fill="#1d2733"
              >
                <tspan x="288.0" dy="0">Report confirmed writes</tspan>
              </text>
            </g>
            <g data-node="true">
              <rect
                x="544"
                y="624"
                width="320"
                height="84"
                rx="24"
                fill="#ffffff"
                stroke="#0755a6"
                stroke-width="3"
              />
              <text
                x="704.0"
                y="659.0"
                text-anchor="middle"
                font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
                font-size="24"
                fill="#1d2733"
              >
                <tspan x="704.0" dy="0">Stop; report confirmed</tspan>
                <tspan x="704.0" dy="30">and uncertain paths</tspan>
              </text>
            </g>
            <text
              x="480"
              y="756"
              text-anchor="middle"
              font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
              font-size="22"
              fill="#1d2733"
            >
              <tspan x="480" dy="0">
                A batch is not atomic. Confirmed writes are not rolled back.
              </tspan>
            </text>
          </svg>
        </div>
        <figcaption>
          Preflight the whole selection and every candidate before writing. A
          refused preflight changes nothing. For each replacement, stage bytes,
          recheck the preimage, rename and verify. Staging, recheck or
          replacement failure stops the batch and reports confirmed writes and
          any uncertain path. Confirmed writes are not rolled back. Replace the
          policy last.
        </figcaption>
      </figure>
    </main>
  </body>
</html>
