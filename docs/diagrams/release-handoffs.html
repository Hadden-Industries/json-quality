            <title id="release-handoffs-title">
              Release automation and owner handoffs
            </title>
            <desc id="release-handoffs-desc">
              Resolve reusable qualification evidence and original archives,
              then have the owner review identities, sign the tag and choose the
              npm channel. Automation stages the native packages; the owner
              approves both with npm 2FA. After their public checks, automation
              stages core and the owner approves it. Qualify the public family
              and archive the immutable GitHub release. Verify availability
              against the reviewed decision. Direct latest publication does not
              require a pilot-to-latest promotion.
