<?xml version="1.0" encoding="UTF-8"?>
<svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 960 944"
            role="img"
            aria-labelledby="release-recovery-title release-recovery-desc"
          >
            <title id="release-recovery-title">
              Reconcile before continuing a release
            </title>
            <desc id="release-recovery-desc">
              After a possible remote effect, stop and inspect the original
              append-only request journal and native provider state. Missing
              journals, truncated history or an unknown outcome block another
              effect. Preserve evidence until the owner settles the original
              operation. A settled result alone does not authorize a retry: the
              owner must reconcile it and explicitly approve a continuation
              bound to the original identities. Observe acknowledged effects
              instead of repeating them; execute only authorized remaining
              operations.
            </desc>
            <defs>
              <marker
                id="release-recovery-arrow"
                markerWidth="8"
                markerHeight="8"
                refX="7"
                refY="4"
                orient="auto"
              >
                <path d="M 0 0 L 8 4 L 0 8 Z" fill="#465568" />
              </marker>
            </defs>
            <rect width="960" height="944" fill="#ffffff" />
            <text
              x="40"
              y="48"
              text-anchor="start"
              font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
              font-size="30"
              fill="#1d2733"
            >
              <tspan x="40" dy="0">Reconcile before continuing a release</tspan>
            </text>
            <path
              data-edge="true"
              d="M 288 164 V 208"
              fill="none"
              stroke="#465568"
              stroke-width="2"
              marker-end="url(#release-recovery-arrow)"
            />
            <path
              data-edge="true"
